[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-lab"
description = "Prática deliberada em Python com missões, testes e evidências."
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7,<15",
    "textual>=0.80,<1",
    "platformdirs>=4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
analysis = ["ruff>=0.14.3,<0.15", "mypy>=1.18.2,<1.19"]
assistant = ["openai>=3.28.0,<4"]

[project.scripts]
lab = "python_lab.cli:main"
python-lab = "python_lab.cli:main"

[tool.setuptools.packages.find]
include = ["python_lab*"]
exclude = ["python_lab.scaffolding.templates*"]

[tool.setuptools.package-data]
"python_lab.tui" = ["*.tcss"]
"python_lab.scaffolding" = [
    "templates/cli/pyproject.toml",
    "templates/cli/README.md",
    "templates/cli/.gitignore",
    "templates/cli/src/__package__/__init__.py",
    "templates/cli/src/__package__/main.py",
    "templates/cli/tests/test_app.py",
    "templates/fastapi/pyproject.toml",
    "templates/fastapi/README.md",
    "templates/fastapi/.gitignore",
    "templates/fastapi/src/__package__/__init__.py",
    "templates/fastapi/src/__package__/main.py",
    "templates/fastapi/tests/test_app.py",
    "templates/flask/pyproject.toml",
    "templates/flask/.gitignore",
    "templates/flask/src/__package__/__init__.py",
    "templates/flask/src/__package__/main.py",
    "templates/flask/tests/test_app.py",
    "templates/flask/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
