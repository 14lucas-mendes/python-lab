[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-lab"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["rich>=13.7,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["python_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
